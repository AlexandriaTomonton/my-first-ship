<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexandria Tomonton</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0a1f44, #3a7bd5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(10, 31, 68, 0.3);
  }
  .card h1 {
    margin: 0 0 8px;
    color: #0a1f44;
    font-size: 28px;
  }
  .card .role {
    color: #3a7bd5;
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 16px;
  }
  .card p {
    color: #2c2c2c;
    line-height: 1.5;
    font-size: 16px;
    margin-bottom: 24px;
  }
  .contact {
    display: inline-block;
    background: #0a1f44;
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Alexandria Tomonton</h1>
    <div class="role">Team Leader</div>
    <p>I support and guide team leaders, helping teams work better together and reach their goals.</p>
    <div class="contact">Let's Connect</div>
  </div>
</body>
</html>
