<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexandria Tomonton</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0A1F3D 0%, #1B3A63 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #e8f0fe;
    color: #1B3A63;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 28px;
    color: #0A1F3D;
    margin-bottom: 8px;
  }
  .role {
    font-size: 16px;
    color: #4a5568;
    margin-bottom: 24px;
  }
  .about {
    font-size: 15px;
    color: #4a5568;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .contact {
    display: inline-block;
    background: #1B3A63;
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Team Leader</div>
    <h1>Alexandria Tomonton</h1>
    <div class="role">Team Leader</div>
    <div class="about">
      I lead a team and care about helping fellow team leaders build better systems, sharper decisions, and stronger teams. Always glad to compare notes with other leaders.
    </div>
    <div class="contact">Let's connect</div>
  </div>
</body>
</html>
